name: Pull Request

on:
  pull_request:

jobs:
  check_membership:
    name: Check Organization Membership
    runs-on: ubuntu-24.04
    outputs:
      is_member: ${{ steps.check.outputs.is_member }}
    steps:
      - name: Check if user is Zendesk org member
        id: check
        run: |
          response=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/orgs/zendesk/members/${{ github.actor }}")
          if [ "$response" = "" ] || echo "$response" | grep -q "Not Found"; then
            echo "is_member=false" >> $GITHUB_OUTPUT
          else
            echo "is_member=true" >> $GITHUB_OUTPUT
          fi

  lint:
    name: Lint
    runs-on: [ubuntu-24.04]
    needs: check_membership
    if: needs.check_membership.outputs.is_member == 'true'
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-go@v2
        with:
          go-version: 1.23.x

      - name: Check gofmt
        run: |
          GOFMT_OUTPUT="$(gofmt -l `find . -name '*.go'`)"

          if [ -n "$GOFMT_OUTPUT" ]; then
            echo "The following files do not meet gofmt specifications"
            echo "${GOFMT_OUTPUT}"
            exit 1
          fi
      - name: Check goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          GOIMPORT_OUTPUT="$(goimports -l `find . -name '*.go'`)"
          if [ -n "$GOIMPORT_OUTPUT" ]; then
            echo "The following files do not meet goimport specifications"
            echo "${GOIMPORT_OUTPUT}"
            exit 1
          fi

  test_unit:
    runs-on: [ubuntu-24.04]
    needs: check_membership
    if: needs.check_membership.outputs.is_member == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.23.x

      - name: Run Unit Tests
        run: |
          unset GOPROXY
          git config --global url."https://${{ github.token }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
          make test

  test_redis:
    runs-on: [ubuntu-24.04]
    needs: check_membership
    if: needs.check_membership.outputs.is_member == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.23.x

      - name: Run Redis Tests
        run: |
          unset GOPROXY
          git config --global url."https://${{ github.token }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
          make redis-up
          make test-redis

