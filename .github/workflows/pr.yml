name: Pull Request

on:
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-go@v2
        with:
          go-version: 1.23.x

      - name: Check gofmt
        run: |
          GOFMT_OUTPUT="$(gofmt -l `find . -name '*.go'`)"
          
          if [ -n "$GOFMT_OUTPUT" ]; then
            echo "The following files do not meet gofmt specifications"
            echo "${GOFMT_OUTPUT}"
            exit 1
          fi
      - name: Check goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          GOIMPORT_OUTPUT="$(goimports -l `find . -name '*.go'`)"
          if [ -n "$GOIMPORT_OUTPUT" ]; then
            echo "The following files do not meet goimport specifications"
            echo "${GOIMPORT_OUTPUT}"
            exit 1
          fi

  test_unit:
    runs-on: [ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.23.x

      - name: Run Unit Tests
        run: |
          unset GOPROXY
          git config --global url."https://${{ github.token }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
          make test
          
  test_redis:
    runs-on: [ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.23.x

      - name: Run Redis Tests
        run: |
          unset GOPROXY
          git config --global url."https://${{ github.token }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
          make redis-up
          make test-redis

