name: Pull Request

on:
  pull_request:

jobs:
  sonarqube:
    name: "Sonarqube"
    runs-on: [self-hosted, zendesk-stable]
    env:
      GO111MODULE: on
    steps:
      - uses: zendesk/checkout@v3
        with:
          fetch-depth: 0
      - uses: zendesk/setup-go@v2
        with:
          go-version: 1.23.x

      - name: Generate Code Coverage Report (via tests)
        run: |
          unset GOPROXY
          git config --global url."https://${{ secrets.ORG_GITHUB_TOKEN }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
          make test-coverage

      - name: Checkout Sonarqube Action Repo
        uses: zendesk/checkout@v2
        with:
          repository: zendesk/zendesk-sonarqube-gh-action
          ref: v1
          token: ${{ secrets.ORG_GITHUB_TOKEN }}
          path: .github/actions/sonarqube_action

      - name: Run Sonarqube Analysis
        uses: ./.github/actions/sonarqube_action
        with:
          sonar_url: ${{ secrets.SONARQUBE_HOST }}
          sonar_token: ${{ secrets.SONARQUBE_TOKEN }}
          product: "go-generics"
          team: "lockbox"

  lint:
    name: Lint
    runs-on: [self-hosted, zendesk-stable]
    steps:
      - uses: zendesk/checkout@v2
      - uses: zendesk/setup-go@v2
        with:
          go-version: 1.23.x

      - name: Check gofmt
        run: |
          GOFMT_OUTPUT="$(gofmt -l `find . -name '*.go'`)"
          
          if [ -n "$GOFMT_OUTPUT" ]; then
            echo "The following files do not meet gofmt specifications"
            echo "${GOFMT_OUTPUT}"
            exit 1
          fi
      - name: Check goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          GOIMPORT_OUTPUT="$(goimports -l `find . -name '*.go'`)"
          if [ -n "$GOIMPORT_OUTPUT" ]; then
            echo "The following files do not meet goimport specifications"
            echo "${GOIMPORT_OUTPUT}"
            exit 1
          fi

  test_unit:
    runs-on: [self-hosted, zendesk-stable]
    steps:
      - name: Checkout
        uses: zendesk/checkout@v3

      - name: Setup Go
        uses: zendesk/setup-go@v2
        with:
          go-version: 1.23.x

      - name: Run Unit Tests
        run: |
          unset GOPROXY
          git config --global url."https://${{ secrets.ORG_GITHUB_TOKEN }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
          make test
  test_redis:
    runs-on: [self-hosted, zendesk-stable]
    steps:
      - name: Checkout
        uses: zendesk/checkout@v3

      - name: Setup Go
        uses: zendesk/setup-go@v2
        with:
          go-version: 1.23.x

      - name: Run Redis Tests
        run: |
          unset GOPROXY
          git config --global url."https://${{ secrets.ORG_GITHUB_TOKEN }}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
          make redis-up
          make test-redis

