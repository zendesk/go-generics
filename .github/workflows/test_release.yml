name: Test

# Default permissions for all jobs - deny all by default
permissions: {}

on:
  push:
    branches:
      - main

jobs:
  test_unit:
    runs-on: [ubuntu-24.04]
    # Only needs to read repository contents for checkout and testing
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.24.x

      - name: Run Unit Tests
        run: |
          make test
