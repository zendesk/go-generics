name: Test

on:
  push:
    branches:
      - main

jobs:
  test_unit:
    runs-on: [ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v2
        with:
          go-version: 1.23.x

      - name: Run Unit Tests
        run: |
          make test
